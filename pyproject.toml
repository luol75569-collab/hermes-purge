[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-purge"
version = "0.2.0"
description = "Armor layer for Hermes: sealed prompts, host-copy rewrites and reversible config"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18.6,<0.19"]

[project.scripts]
hermes-purge = "hermes_purge.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_purge*"]

[tool.setuptools.package-data]
hermes_purge = ["panel.html", "armor/*.md"]
