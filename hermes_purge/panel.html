<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Purge</title>
<style>
:root{color-scheme:dark;--bg:#0c1016;--panel:#151c26;--edge:#293547;--fg:#e8edf5;--muted:#9aa9bd;--accent:#a9ec85}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:60px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge);padding-bottom:24px}h1{font-size:34px;letter-spacing:-1px;margin:0}small,.hint{color:var(--muted)}.tag{color:var(--accent);font:12px monospace;border:1px solid var(--edge);padding:6px 12px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-top:28px}.card{background:var(--panel);border:1px solid var(--edge);padding:24px;border-radius:12px}h2{font-size:18px;margin:0 0 18px}label{display:block;margin:15px 0 6px;color:var(--muted)}select,input,textarea{width:100%;background:var(--bg);border:1px solid var(--edge);border-radius:6px;color:var(--fg);padding:11px;font:14px/1.5 monospace}textarea{min-height:260px;resize:vertical}button{border:1px solid var(--edge);background:var(--bg);color:var(--fg);border-radius:6px;padding:10px 16px;cursor:pointer;margin:14px 8px 0 0}button.primary{background:var(--accent);color:#12200e;font-weight:700}button:disabled{opacity:.35;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:16px;max-height:380px;overflow:auto;font-size:12px}#message{min-height:28px;margin:14px 0;color:var(--accent)}footer{margin:28px 0;color:var(--muted);font-size:12px}a{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}main{margin-top:24px}header{gap:16px}}
</style></head><body><main>
<header><div><small>本地配置 · 原生扩展 · 可验证回滚</small><h1>HERMES / PURGE</h1></div><span class="tag">0.2.0 / ARMOR</span></header>
<p class="hint">变更只作用于选定的 Hermes profile。提示词在新会话冻结；应用后重启 Hermes 并新建会话。</p>
<div class="grid"><section class="card"><h2>配置工作台</h2>
<label for="preset">预设</label><select id="preset"><option>armor</option><option>developer</option><option>minimal</option><option>prompt-only</option></select>
<label for="promptset">破甲提示词套（仅 armor 预设生效；留空按模型自动）</label><select id="promptset"><option value="">按模型自动</option></select>
<label for="mode">Hermes 原生审批模式</label><select id="mode"><option value="">保留当前设置</option><option value="manual">manual · 人工审批</option><option value="smart">smart · 智能审批</option><option value="off">off · 关闭常规审批</option></select>
<p class="hint">off 只调整宿主常规审批；显式 deny、特殊文件检查和模型服务端行为仍由上游决定。</p>
<label for="iterations">每轮工具迭代上限（留空保持原值）</label><input id="iterations" type="number" min="1" max="10000">
<label for="prompt">新会话提示词（最多 4000 字符；留空则注入加密破甲提示词）</label><textarea id="prompt" maxlength="4000"></textarea>
<button id="preview">预览差异</button><button class="primary" id="apply" disabled>备份并应用</button><button id="revert">回滚上次应用</button>
</section><section class="card"><h2>状态与变更证据</h2><div id="message" role="status">正在读取本地状态…</div><pre id="state"></pre><h2>破甲层（加密提示词 / 宿主文案改写）</h2><pre id="armor">尚未读取</pre><h2>变更预览 / 执行结果</h2><pre id="result">尚未预览</pre><button id="refresh">刷新状态</button></section></div>
<footer>参考 <a href="https://github.com/YuJunZhiXue/dsh-purge" target="_blank" rel="noreferrer">YuJunZhiXue/dsh-purge</a> 的管理思路；Hermes 实现独立编写。磁盘状态不是运行时成功证明。</footer>
</main><script>
const $=id=>document.getElementById(id), token=location.hash.slice(1)||sessionStorage.getItem('purge-token')||'';if(token)sessionStorage.setItem('purge-token',token);history.replaceState(null,'',location.pathname);let preview=null,busy=false;
async function api(path,body){const response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data}
function options(){const value={preset:$('preset').value};const prompt=$('prompt').value;if(prompt.trim())value.prompt=prompt;if($('promptset').value)value.prompt_set=$('promptset').value;if($('mode').value)value.approval_mode=$('mode').value;if($('iterations').value)value.max_iterations=Number($('iterations').value);return value}
function invalidate(){preview=null;$('apply').disabled=true}
for(const id of ['preset','promptset','mode','iterations','prompt'])$(id).addEventListener('input',invalidate);
async function refresh(initial=false){const data=await api('status');$('state').textContent=JSON.stringify(data.state,null,2);$('armor').textContent=JSON.stringify(data.armor,null,2);if(initial){$('prompt').value=data.state.prompt||'';const sets=data.armor.prompt_sets||[];$('promptset').innerHTML='<option value="">按模型自动</option>'+sets.map(s=>`<option value="${s.name}"${s.name===(data.state.prompt_set||'')?' selected':''}>${s.label} · ${s.chars} 字符</option>`).join('')}$('message').textContent=data.state.plugin_installed?'已找到插件目录；运行时加载需在 Hermes 中验证。':'插件尚未安装；先执行 hermes-purge install。'}
async function run(task){if(busy)return;busy=true;for(const id of ['preview','apply','revert','refresh','preset','promptset','mode','iterations','prompt'])$(id).disabled=true;try{await task()}catch(error){$('message').textContent=error.message;invalidate()}finally{busy=false;for(const id of ['preview','revert','refresh','preset','promptset','mode','iterations','prompt'])$(id).disabled=false;$('apply').disabled=!preview}}
$('preview').onclick=()=>run(async()=>{const body=options(),result=await api('plan',body);preview={body,hash:result.before_sha256||''};$('result').textContent=JSON.stringify(result,null,2);$('message').textContent='差异已生成；仅改动列出的配置键。'});
$('apply').onclick=()=>run(async()=>{const chosen=preview;if(!chosen)return;const result=await api('apply',{...chosen.body,expected_sha256:chosen.hash});invalidate();$('result').textContent=JSON.stringify(result,null,2);await refresh();$('message').textContent='应用完成。重启 Hermes 并新建会话后验证。'});
$('revert').onclick=()=>run(async()=>{if(!confirm('恢复最近一次配置备份？若检测到后续编辑，将保留当前文件。'))return;const result=await api('revert',{});invalidate();$('result').textContent=JSON.stringify(result,null,2);await refresh();});
$('refresh').onclick=()=>run(async()=>{invalidate();await refresh()});run(()=>refresh(true));
</script></body></html>
